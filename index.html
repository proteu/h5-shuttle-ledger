<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>羽毛球群主记账助理 (ShuttleLedger)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS (Excel解析库) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        /* 针对移动端优化字体与滚动条 */
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 antialiased min-h-screen">
    <div class="max-w-md mx-auto min-h-screen bg-white shadow-lg flex flex-col justify-between">
        <!-- 头部标题区 -->
        <header class="bg-emerald-600 text-white p-4 shadow-sm text-center">
            <h1 class="text-lg font-bold">羽毛球群主记账助理</h1>
            <p class="text-xs text-emerald-100 mt-0.5">多别名匹配 · 智能解析 · 余额自动扣划</p>
        </header>

        <!-- 选项卡导航 -->
        <nav class="flex border-b border-gray-200 bg-gray-50 text-sm sticky top-0 z-10">
            <button id="tab-btn-members" onclick="switchTab('members')" class="flex-1 py-3 text-center font-semibold text-emerald-600 border-b-2 border-emerald-600 bg-white transition-all">
                会员管理
            </button>
            <button id="tab-btn-activity" onclick="switchTab('activity')" class="flex-1 py-3 text-center font-semibold text-gray-500 border-b-2 border-transparent hover:text-emerald-600 transition-all">
                活动记账
            </button>
            <button id="tab-btn-backup" onclick="switchTab('backup')" class="flex-1 py-3 text-center font-semibold text-gray-500 border-b-2 border-transparent hover:text-emerald-600 transition-all">
                导入/备份
            </button>
        </nav>

        <!-- 主内容区域 -->
        <main class="flex-1 p-4 space-y-4">
            
            <!-- 提示信息弹窗 -->
            <div id="toast" class="hidden fixed top-4 left-1/2 transform -translate-x-1/2 z-50 bg-gray-900 text-white text-xs px-4 py-2 rounded-full shadow-lg transition-opacity duration-300">
                <span id="toast-msg">消息提示</span>
            </div>

            <!-- ================= 面板 1: 会员管理 ================= -->
            <section id="panel-members" class="space-y-4">
                <!-- 添加/编辑会员卡片 -->
                <div class="bg-emerald-50/60 p-3.5 rounded-xl border border-emerald-100 space-y-2.5">
                    <div class="flex justify-between items-center">
                        <h2 class="font-bold text-emerald-900 text-sm flex items-center">
                            <span id="form-title">添加新会员</span>
                        </h2>
                        <button id="cancel-edit-btn" onclick="resetMemberForm()" class="hidden text-xs text-gray-500 hover:text-red-500">取消编辑</button>
                    </div>
                    <input type="hidden" id="edit-member-index" value="-1">
                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1">主昵称 <span class="text-red-500">*</span></label>
                        <input type="text" id="member-name" placeholder="例如: 张三" class="w-full px-3 py-1.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none bg-white">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1">别名列表 (多个用逗号隔开)</label>
                        <input type="text" id="member-aliases" placeholder="例如: 三哥, 小张, 张张" class="w-full px-3 py-1.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none bg-white">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1">初始/当前余额 (元)</label>
                        <input type="number" id="member-balance" placeholder="0" class="w-full px-3 py-1.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none bg-white">
                    </div>
                    <button onclick="saveMember()" id="save-member-btn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2 rounded-lg text-sm shadow-sm transition-all">
                        保存会员
                    </button>
                </div>

                <!-- 会员列表 -->
                <div class="space-y-2">
                    <div class="flex justify-between items-center px-1">
                        <h3 class="font-bold text-gray-700 text-sm">会员列表 (<span id="member-count">0</span>)</h3>
                        <button onclick="clearAllMembers()" class="text-xs text-red-500 hover:underline">一键清空</button>
                    </div>
                    <div id="member-list-container" class="space-y-2 max-h-[380px] overflow-y-auto pr-1">
                        <!-- 动态渲染会员 -->
                    </div>
                </div>
            </section>

            <!-- ================= 面板 2: 活动记账 ================= -->
            <section id="panel-activity" class="hidden space-y-4">
                <!-- 价格设定 -->
                <div class="bg-gray-50 p-3 rounded-xl border border-gray-200 space-y-2">
                    <h3 class="font-bold text-gray-700 text-sm">1. 活动费用标准</h3>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="text-xs text-gray-500">会员单价 (元)</label>
                            <input type="number" id="price-member" value="35" class="w-full px-3 py-1.5 border rounded-lg text-sm bg-white focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="text-xs text-gray-500">非会员单价 (元)</label>
                            <input type="number" id="price-guest" value="45" class="w-full px-3 py-1.5 border rounded-lg text-sm bg-white focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                        </div>
                    </div>
                </div>

                <!-- 接龙解析 -->
                <div class="space-y-2">
                    <h3 class="font-bold text-gray-700 text-sm">2. 粘贴微信接龙名单</h3>
                    <p class="text-xs text-gray-400">自动识别格式: `张三` | `李四+2` | `王五挂1` | `赵六 挂`</p>
                    <textarea id="checkin-text" rows="5" placeholder="1. 张三&#10;2. 李四+2&#10;3. 海涛挂1&#10;4. 新球友" class="w-full px-3 py-2 border rounded-lg text-sm bg-white focus:ring-2 focus:ring-emerald-500 focus:outline-none"></textarea>
                    <button id="btn-parse-checkin" onclick="parseCheckinText()" class="w-full bg-blue-600 hover:bg-blue-7[118;1:3u00 text-white font-medium py-2 rounded-lg text-sm shadow-sm transition-all">
                        解析报名名单
                    </button>
                </div>

                <!-- 解析与匹配结算确认区 -->
                <div id="settlement-section" class="hidden space-y-3 border-t border-gray-200 pt-3">
                    <div class="flex justify-between items-center">
                        <h3 class="font-bold text-gray-700 text-sm">3. 匹配与划扣处理</h3>
                        <span class="text-xs text-gray-500">解析成功 <b id="parsed-count" class="text-emerald-600">0</b> 人</span>
                    </div>
                    
                    <div id="participant-list" class="space-y-2 max-h-72 overflow-y-auto pr-1">
                        <!-- 动态列表 -->
                    </div>

                    <button id="btn-execute-settlement" onclick="executeSettlement()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2.5 rounded-lg text-sm shadow transition-all">
                        确认批量划扣并生成公告
                    </button>
                </div>

                <!-- 群公告输出区 -->
                <div id="announcement-section" class="hidden space-y-3 border-t border-gray-200 pt-3">
                    <div class="flex justify-between items-center">
                        <h3 class="font-bold text-gray-700 text-sm">4. 活动划扣公告</h3>
                        <div class="flex items-center space-x-2">
                            <button onclick="copyAnnouncement()" class="text-xs text-emerald-600 font-semibold hover:underline">一键复制公告</button>
                            <button onclick="startNewSettlement()" class="text-xs text-gray-500 bg-gray-100 hover:bg-gray-200 px-2 py-1 rounded transition-all">发起新接龙结算</button>
                        </div>
                    </div>
                    <textarea id="group-announcement" rows="6" readonly class="w-full px-3 py-2 border rounded-lg text-xs bg-gray-50 text-gray-700 font-mono focus:outline-none"></textarea>
                </div>
            </section>

            <!-- ================= 面板 3: 导入与备份 ================= -->
            <section id="panel-backup" class="hidden space-y-4">
                <!-- Excel 导入卡片 -->
                <div class="bg-emerald-50/60 p-4 rounded-xl border border-emerald-100 space-y-3">
                    <h3 class="font-bold text-emerald-900 text-sm">📥 导入 Excel 会员表</h3>
                    <p class="text-xs text-gray-500">上传包含姓名与余额的 .xlsx / .xls 表格，自动读取智能匹配列。</p>
                    <input type="file" id="excel-file-input" accept=".xlsx, .xls, .csv" onchange="handleExcelUpload(event)" class="w-full text-xs text-gray-500 file:mr-3 file:py-2 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-emerald-600 file:text-white hover:file:bg-emerald-700">
                    
                    <div id="excel-column-mapper" class="hidden space-y-3 pt-2 border-t border-emerald-200/60">
                        <div class="grid grid-cols-2 gap-2 text-xs">
                            <div>
                                <label class="block text-gray-600 mb-1 font-medium">“姓名”列：</label>
                                <select id="excel-col-name" class="w-full p-2 border rounded-lg bg-white"></select>
                            </div>
                            <div>
                                <label class="block text-gray-600 mb-1 font-medium">“余额”列：</label>
                                <select id="excel-col-balance" class="w-full p-2 border rounded-lg bg-white"></select>
                            </div>
                        </div>
                        <button onclick="confirmExcelImport()" class="w-full bg-emerald-700 hover:bg-emerald-800 text-white py-2 rounded-lg text-xs font-medium transition-all">
                            确认并导入数据
                        </button>
                    </div>
                </div>

                <!-- JSON 备份与恢复 -->
                <div class="bg-gray-50 p-4 rounded-xl border border-gray-200 space-y-3">
                    <h3 class="font-bold text-gray-700 text-sm">💾 本地数据备份与恢复</h3>
                    <p class="text-xs text-gray-500">建议定期导出备份文件，防止清理浏览器缓存导致数据丢失。</p>
                    <div class="space-y-2">
                        <button onclick="exportJSONBackup()" class="w-full bg-gray-800 hover:bg-gray-900 text-white py-2 rounded-lg text-xs font-medium transition-all">
                            导出数据备份 (.json)
                        </button>
                        <div class="pt-2 border-t border-gray-200">
                            <label class="block text-xs text-gray-600 mb-1">导入 JSON 恢复文件：</label>
                            <input type="file" id="json-file-input" accept=".json" onchange="importJSONBackup(event)" class="w-full text-xs text-gray-500 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-gray-200 file:text-gray-700 hover:file:bg-gray-300">
                        </div>
                    </div>
                </div>
            </section>
        </main>

        <!-- 底部版权 -->
        <footer class="p-3 text-center text-[10px] text-gray-400 border-t border-gray-100">
            ShuttleLedger v6.1 · 本地安全存储 · 离线可用
        </footer>
    </div>

    <!-- 应用程序核心逻辑 -->
    <script>
        // 全局错误捕获
        window.onerror = function(msg, url, line) {
            console.error("全局异常:", msg, "行:", line);
        };

        // ================= 全局状态与数据安全加载 =================
        const CURRENT_KEY = 'badminton_members';
        const HISTORICAL_KEYS = [
            'badminton_members',
            'badminton_members_v5',
            'badminton_members_v4',
            'badminton_members_v3',
            'badminton_members_v2'
        ];

        const DEFAULT_MEMBERS = [
            { name: "张三", aliases: ["老张", "张哥"], balance: 100 },
            { name: "李四", aliases: ["四哥"], balance: 70 },
            { name: "海涛", aliases: ["涛哥"], balance: 150 }
        ];

        let members = [];
        let tempExcelRows = [];
        let isSettled = false; // 防重复提交标志

        // 初始化加载数据
        function initData() {
            let loaded = false;
            for (let key of HISTORICAL_KEYS) {
                try {
                    let raw = localStorage.getItem(key);
                    if (raw) {
                        let parsed = JSON.parse(raw);
                        let list = Array.isArray(parsed) ? parsed : (parsed.members || []);
                        if (Array.isArray(list) && list.length > 0) {
                            members = list.map(m => ({
                                name: String(m.name || '').trim(),
                                aliases: Array.isArray(m.aliases) ? m.aliases.map(a => String(a).trim()).filter(Boolean) : [],
                                balance: typeof m.balance === 'number' && !isNaN(m.balance) ? m.balance : 0
                            })).filter(m => m.name !== '');
                            loaded = true;
                            break;
                        }
                    }
                } catch (e) {
                    console.warn(`读取 key [${key}] 失败:`, e);
                }
            }

            if (!loaded || members.length === 0) {
                members = JSON.parse(JSON.stringify(DEFAULT_MEMBERS));
            }
            saveData();
        }

        // 保存数据至 localStorage 并同步更新会员界面
        function saveData() {
            try {
                localStorage.setItem(CURRENT_KEY, JSON.stringify(members));
            } catch (e) {
                showToast("存储失败，可能浏览器隐私模式受限");
            }
            renderMemberList();
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-msg');
            if (!toast || !toastMsg) return;
            toastMsg.innerText = msg;
            toast.classList.remove('hidden');
            setTimeout(() => {
                toast.classList.add('hidden');
            }, 2500);
        }

        // ================= Tab 面板切换 =================
        function switchTab(tabName) {
            const tabs = ['members', 'activity', 'backup'];
            tabs.forEach(t => {
                const panel = document.getElementById(`panel-${t}`);
                const btn = document.getElementById(`tab-btn-${t}`);
                if (panel) panel.classList.add('hidden');
                if (btn) {
                    btn.classList.remove('text-emerald-600', 'border-emerald-600', 'bg-white');
                    btn.classList.add('text-gray-500', 'border-transparent');
                }
            });

            const activePanel = document.getElementById(`panel-${tabName}`);
            const activeBtn = document.getElementById(`tab-btn-${tabName}`);
            if (activePanel) activePanel.classList.remove('hidden');
            if (activeBtn) {
                activeBtn.classList.remove('text-gray-500', 'border-transparent');
                activeBtn.classList.add('text-emerald-600', 'border-emerald-600', 'bg-white');
            }
        }

        // ================= 1. 会员管理逻辑 =================
        function renderMemberList() {
            const container = document.getElementById('member-list-container');
            const countEl = document.getElementById('member-count');
            if (!container) return;

            countEl.innerText = members.length;

            if (members.length === 0) {
                container.innerHTML = `<p class="text-xs text-gray-400 text-center py-8">暂无会员，请在上方添加或导入数据</p>`;
                return;
            }

            container.innerHTML = members.map((m, idx) => `
                <div class="p-3 bg-gray-50 hover:bg-gray-100 rounded-xl border border-gray-200/80 flex justify-between items-center text-sm transition-all">
                    <div class="space-y-0.5 max-w-[65%]">
                        <div class="font-bold text-gray-800 flex items-center gap-1.5">
                            <span>${escapeHtml(m.name)}</span>
                            ${m.aliases && m.aliases.length > 0 ? `<span class="text-[10px] font-normal text-gray-500 bg-gray-200 px-1.5 py-0.5 rounded-full">别名: ${escapeHtml(m.aliases.join(', '))}</span>` : ''}
                        </div>
                        <div class="text-xs font-semibold ${m.balance < 35 ? 'text-red-500' : 'text-emerald-700'}">
                            余额: ￥${m.balance}
                        </div>
                    </div>
                    <div class="flex items-center space-x-1.5">
                        <button onclick="quickTopUp(${idx})" class="text-xs bg-emerald-100 hover:bg-emerald-200 text-emerald-800 font-medium px-2 py-1 rounded-md transition-all">+50充值</button>
                        <button onclick="editMember(${idx})" class="text-xs bg-gray-200 hover:bg-gray-300 text-gray-700 px-2 py-1 rounded-md transition-all">编辑</button>
                        <button onclick="deleteMember(${idx})" class="text-xs text-red-500 hover:text-red-700 px-1 py-1">删除</button>
                    </div>
                </div>
            `).join('');
        }

        function saveMember() {
            const nameInput = document.getElementById('member-name');
            const aliasesInput = document.getElementById('member-aliases');
            const balanceInput = document.getElementById('member-balance');
            const editIndex = parseInt(document.getElementById('edit-member-index').value);

            const name = nameInput.value.trim();
            if (!name) {
                showToast("请输入主昵称");
                return;
            }

            const aliases = aliasesInput.value.split(/[,，\s]+/).map(a => a.trim()).filter(Boolean);
            const balance = parseFloat(balanceInput.value) || 0;

            if (editIndex >= 0 && editIndex < members.length) {
                members[editIndex] = { name, aliases, balance };
                showToast("会员已更新");
            } else {
                if (members.some(m => m.name === name)) {
                    showToast("已有同名主昵称会员");
                    return;
                }
                members.push({ name, aliases, balance });
                showToast("新增会员成功");
            }

            resetMemberForm();
            saveData();
        }

        function editMember(idx) {
            const m = members[idx];
            if (!m) return;
            document.getElementById('member-name').value = m.name;
            document.getElementById('member-aliases').value = m.aliases ? m.aliases.join(', ') : '';
            document.getElementById('member-balance').value = m.balance;
            document.getElementById('edit-member-index').value = idx;

            document.getElementById('form-title').innerText = "编辑会员信息";
            document.getElementById('cancel-edit-btn').classList.remove('hidden');
            document.getElementById('save-member-btn').innerText = "更新会员";
        }

        function resetMemberForm() {
            document.getElementById('member-name').value = '';
            document.getElementById('member-aliases').value = '';
            document.getElementById('member-balance').value = '';
            document.getElementById('edit-member-index').value = -1;

            document.getElementById('form-title').innerText = "添加新会员";
            document.getElementById('cancel-edit-btn').classList.add('hidden');
            document.getElementById('save-member-btn').innerText = "保存会员";
        }

        function quickTopUp(idx) {
            if (members[idx]) {
                members[idx].balance += 50;
                saveData();
                showToast(`已为 ${members[idx].name} 充值 ￥50`);
            }
        }

        function deleteMember(idx) {
            if (confirm(`确定要删除会员【${members[idx].name}】吗？`)) {
                members.splice(idx, 1);
                saveData();
                showToast("已删除会员");
            }
        }

        function clearAllMembers() {
            if (confirm("高危操作：确定要清空全部会员数据吗？")) {
                members = [];
                saveData();
                showToast("全员数据已清空");
            }
        }

        function findMemberByName(keyword) {
            if (!keyword) return null;
            const kw = keyword.trim().toLowerCase();
            return members.find(m => 
                m.name.toLowerCase() === kw || 
                (m.aliases && m.aliases.some(a => a.toLowerCase() === kw))
            );
        }

        // ================= 2. 活动记账与解析逻辑 =================
        function parseCheckinText() {
            const text = document.getElementById('checkin-text').value;
            if (!text.trim()) {
                showToast("请先粘贴接龙文本");
                return;
            }

            // 重置划扣状态
            isSettled = false;
            document.getElementById('btn-execute-settlement').disabled = false;
            document.getElementById('btn-execute-settlement').innerText = "确认批量划扣并生成公告";
            document.getElementById('btn-execute-settlement').classList.remove('opacity-50', 'cursor-not-allowed');

            const lines = text.split('\n');
            let parsedList = [];

            lines.forEach(line => {
                let cleaned = line.replace(/^\d+[\.、\s]*/, '').trim();
                if (!cleaned || cleaned.length > 25 || cleaned.includes('http')) return;

                let count = 1;
                let lookupName = cleaned;

                let matchPlus = cleaned.match(/^(.+?)\s*\+\s*(\d+)$/);
                let matchGua = cleaned.match(/^(.+?)\s*挂\s*(\d*)$/);

                if (matchPlus) {
                    lookupName = matchPlus[1].trim();
                    count = 1 + parseInt(matchPlus[2]);
                } else if (matchGua) {
                    lookupName = matchGua[1].trim();
                    count = 1;
                }

                const matchedMember = findMemberByName(lookupName);

                parsedList.push({
                    rawText: cleaned,
                    lookupName: lookupName,
                    count: count,
                    matchedMember: matchedMember
                });
            });

            if (parsedList.length === 0) {
                showToast("未能从文本中解析出有效人员名单");
                return;
            }

            renderParticipantList(parsedList);
        }

        function renderParticipantList(list) {
            const container = document.getElementById('participant-list');
            document.getElementById('parsed-count').innerText = list.length;

            container.innerHTML = list.map((item, idx) => {
                const isMatched = !!item.matchedMember;
                
                let selectOptions = '';
                if (isMatched) {
                    selectOptions = `
                        <option value="member" selected>会员扣费 (${escapeHtml(item.matchedMember.name)})</option>
                        <option value="guest">非会员(现金/转账)</option>
                    `;
                } else {
                    selectOptions = `
                        <option value="guest" selected>非会员(现金/转账)</option>
                        <option value="create">新建会员扣款</option>
                        <option value="link">归为已有会员别名</option>
                    `;
                }

                return `
                    <div class="p-2.5 bg-gray-50 rounded-lg border border-gray-200 text-xs space-y-2 participant-item" 
                         data-rawtext="${escapeHtml(item.rawText)}" 
                         data-lookupname="${escapeHtml(item.lookupName)}" 
                         data-count="${item.count}">
                        <div class="flex justify-between items-center gap-2">
                            <div class="font-medium text-gray-800 truncate">
                                <span>${escapeHtml(item.rawText)}</span>
                                <span class="text-[10px] text-blue-600 ml-1">(核算归属: ${escapeHtml(item.lookupName)}, ${item.count}人)</span>
                            </div>
                            <select onchange="handleActionTypeChange(this)" class="action-type-select border border-gray-300 rounded px-2 py-1 bg-white focus:outline-none">
                                ${selectOptions}
                            </select>
                        </div>
                        
                        <div class="sub-action-box hidden bg-white p-2 rounded border border-emerald-200 space-y-1.5">
                        </div>
                    </div>
                `;
            }).join('');

            document.getElementById('settlement-section').classList.remove('hidden');
            document.getElementById('announcement-section').classList.add('hidden');
        }

        function handleActionTypeChange(selectEl) {
            const val = selectEl.value;
            const itemBox = selectEl.closest('.participant-item');
            const subBox = itemBox.querySelector('.sub-action-box');

            subBox.innerHTML = '';
            subBox.classList.add('hidden');

            if (val === 'create') {
                subBox.innerHTML = `
                    <div class="flex items-center justify-between text-emerald-800">
                        <span>设置本次扣款前充值金额：</span>
                        <div class="flex items-center gap-1">
                            <span>￥</span>
                            <input type="number" value="100" class="new-member-init-bal w-20 px-1.5 py-0.5 border rounded text-xs bg-emerald-50/50 font-bold">
                        </div>
                    </div>
                `;
                subBox.classList.remove('hidden');
            } else if (val === 'link') {
                let optionsHtml = members.map(m => `<option value="${escapeHtml(m.name)}">${escapeHtml(m.name)} (余额:￥${m.balance})</option>`).join('');
                subBox.innerHTML = `
                    <div class="flex items-center justify-between text-blue-800">
                        <span>关联到已有会员：</span>
                        <select class="link-target-member border rounded px-1.5 py-0.5 text-xs bg-blue-50/50 font-semibold">
                            ${optionsHtml}
                        </select>
                    </div>
                `;
                subBox.classList.remove('hidden');
            }
        }

        // 执行划扣 - 包含防重复和状态清理机制
        function executeSettlement() {
            if (isSettled) {
                showToast("本次接龙已划扣过！如需重新结算，请先“发起新接龙结算”");
                return;
            }

            const items = document.querySelectorAll('.participant-item');
            if (items.length === 0) return;

            const memberPrice = parseFloat(document.getElementById('price-member').value) || 35;
            const guestPrice = parseFloat(document.getElementById('price-guest').value) || 45;

            let logLines = [];

            items.forEach(item => {
                const rawText = item.getAttribute('data-rawtext');
                const lookupName = item.getAttribute('data-lookupname');
                const count = parseInt(item.getAttribute('data-count')) || 1;
                const actionType = item.querySelector('.action-type-select').value;
                const subBox = item.querySelector('.sub-action-box');

                if (actionType === 'member') {
                    const member = findMemberByName(lookupName);
                    if (member) {
                        const totalCost = memberPrice * count;
                        member.balance -= totalCost;
                        logLines.push(`• ${rawText}: 划扣 ￥${totalCost} [归属:${member.name}, 余:￥${member.balance}]`);
                    }
                } else if (actionType === 'create') {
                    const initBalInput = subBox.querySelector('.new-member-init-bal');
                    const initBal = initBalInput ? parseFloat(initBalInput.value) || 0 : 0;
                    const totalCost = memberPrice * count;
                    const finalBal = initBal - totalCost;

                    members.push({
                        name: lookupName,
                        aliases: [],
                        balance: finalBal
                    });

                    logLines.push(`• ${rawText}: 新建会员 [充费:￥${initBal}, 本次扣:￥${totalCost}, 余:￥${finalBal}]`);
                } else if (actionType === 'link') {
                    const targetSelect = subBox.querySelector('.link-target-member');
                    const targetName = targetSelect ? targetSelect.value : '';
                    const targetMember = findMemberByName(targetName);

                    if (targetMember) {
                        const totalCost = memberPrice * count;
                        targetMember.balance -= totalCost;

                        if (!targetMember.aliases.includes(lookupName) && targetMember.name !== lookupName) {
                            targetMember.aliases.push(lookupName);
                        }

                        logLines.push(`• ${rawText}: 挂靠划扣 ￥${totalCost} [归属:${targetMember.name}, 余:￥${targetMember.balance}] (已补入别名)`);
                    }
                } else {
                    const totalCost = guestPrice * count;
                    logLines.push(`• ${rawText}: 现金/转账 ￥${totalCost} (${count}人)`);
                }
            });

            // 标记已划扣，禁用重复点击
            isSettled = true;
            const btnExec = document.getElementById('btn-execute-settlement');
            btnExec.disabled = true;
            btnExec.innerText = "已划扣完成";
            btnExec.classList.add('opacity-50', 'cursor-not-allowed');

            saveData();

            // 生成群公告长文
            const dateStr = new Date().toLocaleDateString();
            let announcement = `🏸【羽毛球活动结算账单】(${dateStr})\n`;
            announcement += `------------------------------\n`;
            announcement += logLines.join('\n');
            announcement += `\n------------------------------\n`;
            announcement += `备注: 会员扣费已自动完成，请核对余额。`;

            document.getElementById('group-announcement').value = announcement;
            document.getElementById('announcement-section').classList.remove('hidden');

            // 划扣成功后隐藏划扣确认区，防止重复扣款
            document.getElementById('settlement-section').classList.add('hidden');

            showToast("结算划扣成功，已更新余额并生成公告！");
        }

        // 重置/发起新接龙结算
        function startNewSettlement() {
            document.getElementById('checkin-text').value = '';
            document.getElementById('participant-list').innerHTML = '';
            document.getElementById('settlement-section').classList.add('hidden');
            document.getElementById('announcement-section').classList.add('hidden');
            document.getElementById('group-announcement').value = '';

            isSettled = false;
            const btnExec = document.getElementById('btn-execute-settlement');
            btnExec.disabled = false;
            btnExec.innerText = "确认批量划扣并生成公告";
            btnExec.classList.remove('opacity-50', 'cursor-not-allowed');

            showToast("状态已重置，可以输入新接龙了");
        }

        function copyAnnouncement() {
            const textarea = document.getElementById('group-announcement');
            if (!textarea || !textarea.value) return;
            textarea.select();
            document.execCommand('copy');
            showToast("公告已成功复制到剪贴板");
        }

        // ================= 3. Excel 与 JSON 导入备份逻辑 =================
        function handleExcelUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const sheetName = workbook.SheetNames[0];
                    const rows = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], { defval: "" });

                    if (rows.length === 0) {
                        showToast("Excel 表格内容为空");
                        return;
                    }

                    tempExcelRows = rows;
                    const keys = Object.keys(rows[0]);

                    const nameSelect = document.getElementById('excel-col-name');
                    const balanceSelect = document.getElementById('excel-col-balance');

                    nameSelect.innerHTML = keys.map(k => `<option value="${escapeHtml(k)}">${escapeHtml(k)}</option>`).join('');
                    balanceSelect.innerHTML = keys.map(k => `<option value="${escapeHtml(k)}">${escapeHtml(k)}</option>`).join('');

                    keys.forEach(k => {
                        const l = k.toLowerCase();
                        if (l.includes('名') || l.includes('称') || l.includes('昵') || l.includes('会员')) nameSelect.value = k;
                        if (l.includes('余') || l.includes('额') || l.includes('卡') || l.includes('钱')) balanceSelect.value = k;
                    });

                    document.getElementById('excel-column-mapper').classList.remove('hidden');
                    showToast(`读取成功，共 ${rows.length} 行数据`);
                } catch (err) {
                    showToast("解析 Excel 失败，请检查文件格式");
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function confirmExcelImport() {
            if (tempExcelRows.length === 0) return;

            const nameKey = document.getElementById('excel-col-name').value;
            const balanceKey = document.getElementById('excel-col-balance').value;

            let count = 0;
            tempExcelRows.forEach(row => {
                const name = String(row[nameKey] || '').trim();
                const balance = parseFloat(row[balanceKey]) || 0;

                if (name) {
                    const existing = members.find(m => m.name === name);
                    if (existing) {
                        existing.balance = balance;
                    } else {
                        members.push({ name, aliases: [], balance });
                    }
                    count++;
                }
            });

            saveData();
            document.getElementById('excel-column-mapper').classList.add('hidden');
            document.getElementById('excel-file-input').value = '';
            showToast(`成功导入/更新 ${count} 名会员`);
            switchTab('members');
        }

        function exportJSONBackup() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({
                version: "6.1",
                exportTime: new Date().toISOString(),
                members: members
            }));
            const a = document.createElement('a');
            a.href = dataStr;
            a.download = `羽毛球会员备份_${new Date().toISOString().slice(0,10)}.json`;
            document.body.appendChild(a);
            a.click();
            a.remove();
        }

        function importJSONBackup(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    let list = Array.isArray(imported) ? imported : (imported.members || []);

                    if (Array.isArray(list) && list.length > 0) {
                        members = list.map(m => ({
                            name: String(m.name || '').trim(),
                            aliases: Array.isArray(m.aliases) ? m.aliases : [],
                            balance: typeof m.balance === 'number' ? m.balance : 0
                        })).filter(m => m.name !== '');

                        saveData();
                        showToast("备份恢复成功！");
                        switchTab('members');
                    } else {
                        showToast("备份文件格式不正确");
                    }
                } catch (err) {
                    showToast("解析 JSON 恢复文件失败");
                }
            };
            reader.readAsText(file);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        window.onload = function() {
            initData();
        };
    </script>
</body>
