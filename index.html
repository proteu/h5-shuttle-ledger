<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>羽毛球群主记账助理 (ShuttleLedger Pro)</title>
    <!-- Tailwind CSS CDN -->

<body class="bg-gray-50 text-gray-800 antialiased">
    <div class="max-w-md mx-auto min-h-screen bg-white shadow-sm flex flex-col">
        <!-- 顶部标题 -->
        <header class="bg-emerald-600 text-white p-4 text-center font-bold text-lg shadow">
            羽毛球群主记账助理
        </header>

        <!-- 选项卡导航 -->
        <nav class="flex border-b border-gray-200 bg-gray-100 text-xs sm:text-sm">
            <button onclick="switchTab('members')" id="tab-members" class="flex-1 py-3 text-center font-medium text-emerald-600 border-b-2 border-emerald-600 bg-white">会员管理</button>
            <button onclick="switchTab('activity')" id="tab-activity" class="flex-1 py-3 text-center font-medium text-gray-500">活动记账</button>
            <button onclick="switchTab('history')" id="tab-history" class="flex-1 py-3 text-center font-medium text-gray-500">历史活动</button>
            <button onclick="switchTab('backup')" id="tab-backup" class="flex-1 py-3 text-center font-medium text-gray-500">导入/备份</button>
        </nav>

        <!-- 内容区域 -->
        <main class="flex-1 p-4 pb-20">
            <!-- 1. 会员管理面板 -->
            <section id="panel-members" class="space-y-4">
                <div class="bg-emerald-50 p-3 rounded-lg border border-emerald-100 space-y-2">
                    <h3 class="font-bold text-emerald-800 text-sm">添加新会员（支持别名）</h3>
                    <input type="text" id="new-name" placeholder="主昵称 (例如: 林海涛)" class="w-full px-3 py-2 border rounded-md text-sm bg-white">
                    <input type="text" id="new-aliases" placeholder="别名/曾用名，用逗号隔开 (例如: 海涛, 涛哥)" class="w-full px-3 py-2 border rounded-md text-sm bg-white">
                    <input type="number" id="new-balance" placeholder="初始余额 (元)" class="w-full px-3 py-2 border rounded-md text-sm bg-white">
                    <button onclick="addMember()" class="w-full bg-emerald-600 text-white py-2 rounded-md text-sm font-medium hover:bg-emerald-700">添加会员</button>
                </div>

                <div>
                    <div class="flex justify-between items-center mb-2">
                        <h3 class="font-bold text-gray-700 text-sm">会员列表 (<span id="member-count">0</span>)</h3>
                        <div class="space-x-2">
                            <button onclick="exportMembersExcel()" class="text-xs bg-emerald-100 text-emerald-700 px-2 py-1 rounded hover:bg-emerald-200 font-medium">导出Excel</button>
                            <button onclick="clearAllMembers()" class="text-xs text-red-500 hover:underline">清空全部</button>
                        </div>
                    </div>
                    <div id="member-list" class="space-y-2 max-h-96 overflow-y-auto"></div>
                </div>
            </section>

            <!-- 2. 活动记账面板 -->
            <section id="panel-activity" class="hidden space-y-4">
                <div class="space-y-3 bg-gray-50 p-3 rounded-lg border">
                    <h3 class="font-bold text-gray-700 text-sm">1. 本场活动单价设置</h3>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="text-xs text-gray-500">会员单价 (元)</label>
                            <input type="number" id="member-price" value="35" class="w-full px-3 py-2 border rounded-md text-sm bg-white">
                        </div>
                        <div>
                            <label class="text-xs text-gray-500">非会员单价 (元)</label>
                            <input type="number" id="guest-price" value="45" class="w-full px-3 py-2 border rounded-md text-sm bg-white">
                        </div>
                    </div>
                </div>

                <div class="space-y-2">
                    <h3 class="font-bold text-gray-700 text-sm">2. 粘贴微信完整接龙内容</h3>
                    <p class="text-xs text-gray-400">可包含活动日期、球馆地点、时间及名单，系统会自动识别并提取。</p>
                    <textarea id="checkin-text" rows="8" placeholder="例如：&#10;2026年10月25日(星期日）时间：19:00--21:00&#10;地点：一六八羽毛球馆&#10;&#10;1东东&#10;2竹子&#10;4老刘&#10;5阿毛挂1" class="w-full px-3 py-2 border rounded-md text-sm bg-white font-mono"></textarea>
                    <button onclick="parseCheckin()" class="w-full bg-blue-600 text-white py-2 rounded-md text-sm font-medium hover:bg-blue-700">解析活动与名单</button>
                </div>

                <!-- 识别到的活动头信息提示 -->
                <div id="activity-info-card" class="hidden bg-blue-50 border border-blue-200 p-3 rounded-md text-xs space-y-1">
                    <div class="font-bold text-blue-800">📌 识别到活动信息：</div>
                    <div><span class="text-gray-500">日期：</span><span id="parsed-date" class="font-medium text-gray-800"></span></div>
                    <div><span class="text-gray-500">地点：</span><span id="parsed-location" class="font-medium text-gray-800"></span></div>
                    <div><span class="text-gray-500">时间：</span><span id="parsed-time" class="font-medium text-gray-800"></span></div>
                </div>

                <!-- 结算列表 -->
                <div id="settlement-result" class="hidden space-y-3 border-t pt-3">
                    <h3 class="font-bold text-gray-700 text-sm">3. 结算与划扣确认</h3>
                    <div id="participant-list" class="space-y-2 max-h-60 overflow-y-auto"></div>
                    <button onclick="executeDeduction()" class="w-full bg-emerald-600 text-white py-2 rounded-md text-sm font-medium hover:bg-emerald-700">确认批量划扣并归档历史</button>
                </div>

                <!-- 群公告输出与重置 -->
                <div id="output-box" class="hidden space-y-3 border-t pt-3">
                    <div class="flex justify-between items-center">
                        <h3 class="font-bold text-gray-700 text-sm">4. 活动结算公告</h3>
                        <button onclick="copyAnnouncement()" class="text-xs bg-blue-100 text-blue-700 px-2 py-1 rounded hover:bg-blue-200">一键复制公告</button>
                    </div>
                    <textarea id="group-announcement" rows="7" readonly class="w-full px-3 py-2 border rounded-md text-xs bg-gray-100 font-mono"></textarea>
                    
                    <button onclick="resetActivityForm()" class="w-full bg-gray-100 text-gray-700 border py-2 rounded-md text-xs font-medium hover:bg-gray-200">
                        🔄 发起新接龙结算 (清空当前)
                    </button>
                </div>
            </section>

            <!-- 3. 历史活动记录面板 -->
            <section id="panel-history" class="hidden space-y-4">
                <div class="flex justify-between items-center bg-gray-50 p-3 rounded-lg border">
                    <div>
                        <h3 class="font-bold text-gray-700 text-sm">历史活动档案</h3>
                        <p class="text-xs text-gray-400">已保存 <span id="history-count">0</span> 场活动记录</p>
                    </div>
                    <button onclick="exportAllHistoryExcel()" class="bg-emerald-600 text-white text-xs px-3 py-1.5 rounded hover:bg-emerald-700 font-medium">导出所有活动 Excel</button>
                </div>

                <div id="history-list" class="space-y-3 max-h-[500px] overflow-y-auto"></div>
            </section>

            <!-- 4. 数据备份与 Excel 导入面板 -->
            <section id="panel-backup" class="hidden space-y-4">
              [118;1:3u  <div class="bg-emerald-50 p-4 rounded-lg border border-emerald-100 space-y-3">
                    <h3 class="font-bold text-emerald-800 text-sm">📥 导入群主现有 Excel 表格</h3>
                    <input type="file" id="excel-file" accept=".xlsx, .xls, .csv" onchange="previewExcel(event)" class="w-full text-xs text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-emerald-600 file:text-white hover:file:bg-emerald-700">
                    
                    <div id="excel-preview-box" class="hidden space-y-3 pt-2 border-t border-emerald-200">
                        <div class="grid grid-cols-2 gap-2 text-xs">
                            <div>
                                <label class="block text-gray-600 mb-1">选择“姓名”列：</label>
                                <select id="col-name" class="w-full p-1.5 border rounded bg-white"></select>
                            </div>
                            <div>
                                <label class="block text-gray-600 mb-1">选择“余额”列：</label>
                                <select id="col-balance" class="w-full p-1.5 border rounded bg-white"></select>
                            </div>
                        </div>
                        <button onclick="confirmExcelImport()" class="w-full bg-emerald-700 text-white py-2 rounded-md text-xs font-medium hover:bg-emerald-800">确认导入会员库</button>
                    </div>
                </div>

                <div class="bg-gray-50 p-4 rounded-lg border space-y-3">
                    <h3 class="font-bold text-gray-700 text-sm">💾 本地 JSON 完整备份与恢复</h3>
                    <p class="text-xs text-gray-500">导出包含所有会员余额及历史打球档案的备份文件。</p>
                    <button onclick="exportData()" class="w-full bg-gray-800 text-white py-2 rounded-md text-sm font-medium hover:bg-gray-900">导出数据备份 (.json)</button>
                    <div class="pt-2 border-t">
                        <label class="block text-xs text-gray-500 mb-1">恢复备份文件</label>
                        <input type="file" id="import-json-file" accept=".json" onchange="importJSONData(event)" class="w-full text-xs text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-gray-200 file:text-gray-700">
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script>
        // 初始化数据库结构
        let rawMembers = [];
        const keysToTry = ['badminton_members', 'badminton_members_v5', 'badminton_members_v4'];
        for (let k of keysToTry) {
            let val = localStorage.getItem(k);
            if (val) {
                try {
                    let parsed = JSON.parse(val);
                    if (Array.isArray(parsed) && parsed.length > 0) {
                        rawMembers = parsed;
                        break;
                    } else if (parsed && Array.isArray(parsed.members) && parsed.members.length > 0) {
                        rawMembers = parsed.members;
                        break;
                    }
                } catch (e) {}
            }
        }

        let rawHistory = [];
        try {
            rawHistory = JSON.parse(localStorage.getItem('badminton_history') || '[]');
        } catch (e) {}

        let db = {
            members: rawMembers.map(m => ({
                name: m.name || '',
                aliases: m.aliases || [],
                balance: typeof m.balance === 'number' ? m.balance : 0
            })),
            history: rawHistory
        };

        let tempExcelRows = [];
        let currentParsedHeader = { date: '', location: '', time: '' };
        let isSettledCurrentSession = false;

        function saveDB() {
            localStorage.setItem('badminton_members', JSON.stringify(db.members));
            localStorage.setItem('badminton_history', JSON.stringify(db.history));
            renderMembers();
            renderHistory();
        }

        // 面板切换
        function switchTab(tab) {
            ['members', 'activity', 'history', 'backup'].forEach(t => {
                const panel = document.getElementById(`panel-${t}`);
                const tabBtn = document.getElementById(`tab-${t}`);
                if (panel) panel.classList.add('hidden');
                if (tabBtn) tabBtn.className = "flex-1 py-3 text-center font-medium text-gray-500 bg-gray-100 border-b-0";
            });
            const activePanel = document.getElementById(`panel-${tab}`);
            const activeTabBtn = document.getElementById(`tab-${tab}`);
            if (activePanel) activePanel.classList.remove('hidden');
            if (activeTabBtn) activeTabBtn.className = "flex-1 py-3 text-center font-medium text-emerald-600 border-b-2 border-emerald-600 bg-white";
        }

        // 渲染会员列表
        function renderMembers() {
            const listEl = document.getElementById('member-list');
            const countEl = document.getElementById('member-count');
            if (!listEl) return;
            if (countEl) countEl.innerText = db.members.length;

            if (db.members.length === 0) {
                listEl.innerHTML = '<p class="text-xs text-gray-400 text-center py-4">暂无会员，请手动添加或导入 Excel</p>';
                return;
            }
            listEl.innerHTML = db.members.map((m, index) => `
                <div class="flex justify-between items-center p-2.5 bg-gray-50 rounded-md border text-sm">
                    <div>
                        <span class="font-medium">${m.name}</span>
                        <span class="text-xs text-gray-500 ml-1">(${m.aliases && m.aliases.length ? m.aliases.join(', ') : '无别名'})</span>
                        <div class="text-xs text-emerald-700 font-semibold mt-0.5">余额: ￥${m.balance}</div>
                    </div>
                    <div class="space-x-1">
                        <button onclick="adjustBalance(${index}, 50)" class="text-xs bg-emerald-100 text-emerald-700 px-2 py-1 rounded hover:bg-emerald-200">+50充值</button>
                        <button onclick="deleteMember(${index})" class="text-xs text-red-500 hover:underline">删除</button>
                    </div>
                </div>
            `).join('');
        }

        // 导出会员列表为 Excel
        function exportMembersExcel() {
            if (!db.members || db.members.length === 0) {
                return alert('当前没有会员数据可导出');
            }
            const excelData = db.members.map((m, index) => ({
                "序号": index + 1,
                "姓名/主昵称": m.name,
                "别名/曾用名": m.aliases ? m.aliases.join(', ') : '',
                "当前余额(元)": m.balance
            }));

            const worksheet = XLSX.utils.json_to_sheet(excelData);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "会员档案");
            XLSX.writeFile(workbook, `羽毛球会员档案_${new Date().toISOString().slice(0,10)}.xlsx`);
        }

        function addMember() {
            const name = document.getElementById('new-name').value.trim();
            const aliasesRaw = document.getElementById('new-aliases').value.trim();
            const balance = parseFloat(document.getElementById('new-balance').value) || 0;
            
            if (!name) return alert('请输入主昵称');
            const aliases = aliasesRaw ? aliasesRaw.split(/[,，\s]+/).filter(a => a) : [];
            
            db.members.push({ name, aliases, balance });
            document.getElementById('new-name').value = '';
            document.getElementById('new-aliases').value = '';
            document.getElementById('new-balance').value = '';
            saveDB();
        }

        function adjustBalance(index, amount) {
            db.members[index].balance += amount;
            saveDB();
        }

        function deleteMember(index) {
            if (confirm('确认删除该会员吗？')) {
                db.members.splice(index, 1);
                saveDB();
            }
        }

        function clearAllMembers() {
            if (confirm('警告：确定清空所有会员数据吗？')) {
                db.members = [];
                saveDB();
            }
        }

        function findMemberByName(keyword) {
            if (!keyword) return null;
            keyword = keyword.trim();
            return db.members.find(m => m.name === keyword || (m.aliases && m.aliases.includes(keyword)));
        }

        // 接龙解析逻辑（精准拆分同行的日期与时间）
        // 升级版接龙解析逻辑（修复地点行被误判为报名人的Bug）
        function parseCheckin() {
            const text = document.getElementById('checkin-text').value;
            if (!text.trim()) return alert('请先粘贴接龙文本');
            
            isSettledCurrentSession = false; // 重置结算防重锁
            const lines = text.split('\n').map(l => l.trim()).filter(l => l);
            
            let dateStr = '';
            let locationStr = '';
            let timeStr = '';
            let participantLines = [];

            lines.forEach(line => {
                // 过滤常见的尾部福利/提示信息、表头说明
                if (line.includes('温馨提示') || line.includes('免责声明') || line.includes('AA制') || line.includes('福利') || line.includes('拉线') || line.includes('眼镜') || line.includes('报名跟帖') || line.includes('报名结束') || line.includes('打球报名')) {
                    return;
                }

                // 1. 匹配日期
                const dateMatch = line.match(/(\d{4}年\d{1,2}月\d{1,2}日(?:\([\s\S]*?\)|（[\s\S]*?）)?|\d{1,2}月\d{1,2}日(?:\([\s\S]*?\)|（[\s\S]*?）)?)/);
                if (dateMatch && !dateStr) {
                    dateStr = dateMatch[1];
                    return; // 匹配成功直接跳过
                }

                // 2. 匹配时间
                const timeMatch = line.match(/(?:时间[:：]?)?\s*(\d{1,2}[:：]\d{2}\s*[-－—~〜]+\s*\d{1,2}[:：]\d{2}|周[一二三四五六日天][\s\S]*?\d{1,2}[:：]\d{2}[\s\S]*)/);
                if (timeMatch && !timeStr) {
                    timeStr = timeMatch[1] || timeMatch[0];
                    timeStr = timeStr.replace(/^时间[:：]?\s*/, '');
                    return; // 匹配成功直接跳过
                }

                // 3. 匹配地点（包含馆、场地、地点等特征）
                if (!locationStr && (line.includes('球馆') || line.includes('场地') || line.includes('地点') || line.includes('馆'))) {
                    locationStr = line.replace(/^地点[:：]?\s*/, '');
                    return; // 【关键修复】匹配到地点后必须直接 return，绝不能让它流转到下方的报名人解析中！
                }

                // 4. 识别有效报名人员行（带数字序号，且严格排除包含场馆/通知等关键词的行）
                const hasLocationKeyword = line.includes('球馆') || line.includes('场地') || line.includes('馆');
                if (line.match(/^\d+[\.、\s]*/) && !hasLocationKeyword && !line.includes('年') && !line.includes('月')) {
                    participantLines.push(line);
                }
            });

            if (!dateStr) {
                const today = new Date();
                dateStr = `${today.getFullYear()}年${today.getMonth()+1}月${today.getDate()}日`;
            }

            currentParsedHeader = {
                date: dateStr,
                location: locationStr || '未填写场地',
                time: timeStr || '未填写具体时间'
            };

            // 更新界面卡片展示
            document.getElementById('parsed-date').innerText = currentParsedHeader.date;
            document.getElementById('parsed-location').innerText = currentParsedHeader.location;
            document.getElementById('parsed-time').innerText = currentParsedHeader.time;
            document.getElementById('activity-info-card').classList.remove('hidden');

            // 解析人员名单
            let parsedItems = [];
            participantLines.forEach(line => {
                let cleaned = line.replace(/^\d+[\.、\s]*/, '').trim();
                if (!cleaned || cleaned.length > 20) return;

                let count = 1;
                let lookupName = cleaned;

                // 规则 1：甲+2
                let match = cleaned.match(/^(.+?)\s*\+\s*(\d+)$/);
                if (match) {
                    lookupName = match[1].trim();
                    count = 1 + parseInt(match[2]);
                } else {
                    // 规则 2：球友A挂 / 球友A挂1
                    match = cleaned.match(/^(.+?)挂(\d*)\s*$/);
                    if (match) {
                        lookupName = match[1].trim();
                        count = 1;
                    }
                }

                const matchedMember = findMemberByName(lookupName);
                parsedItems.push({
                    rawText: cleaned,
                    lookupName: lookupName,
                    count: count,
                    isMember: !!matchedMember,
                    memberName: matchedMember ? matchedMember.name : lookupName
                });
            });

            const container = document.getElementById('participant-list');
            if (parsedItems.length === 0) {
                container.innerHTML = '<p class="text-xs text-red-500 py-2">未在文本中识别到有效的接龙序号和名单，请检查文本格式。</p>';
            } else {
                container.innerHTML = parsedItems.map((item) => {
                    let selectHtml = '';
                    if (item.isMember) {
                        selectHtml = `
                            <select class="payer-type border rounded p-1 text-xs bg-white" onchange="onActionChange(this)">
                                <option value="member" selected>会员扣款 (${item.memberName})</option>
                                <option value="guest">非会员(现付)</option>
                            </select>
                        `;
                    } else {
                        selectHtml = `
                            <select class="payer-type border rounded p-1 text-xs bg-white" onchange="onActionChange(this)">
                                <option value="guest" selected>非会员(现付)</option>
                                <option value="create">新建会员扣款</option>
                                <option value="link">归为已有会员别名</option>
                            </select>
                        `;
                    }

                    return `
                        <div class="p-2 bg-gray-50 rounded border text-sm participant-row space-y-1" 
                             data-rawtext="${item.rawText}" data-lookupname="${item.lookupName}" data-count="${item.count}">
                            <div class="flex justify-between items-center">
                                <span class="font-medium">${item.rawText}</span>
                                ${selectHtml}
                            </div>
                            <div class="sub-action hidden"></div>
                        </div>
                    `;
                }).join('');
            }

            document.getElementById('settlement-result').classList.remove('hidden');
            document.getElementById('output-box').classList.add('hidden');
        }

        function onActionChange(selectEl) {
            const val = selectEl.value;
            const row = selectEl.closest('.participant-row');
            const subActionDiv = row.querySelector('.sub-action');
            subActionDiv.innerHTML = '';
            subActionDiv.classList.add('hidden');

            if (val === 'create') {
                subActionDiv.innerHTML = `
                    <div class="text-xs text-emerald-800 space-y-1 pt-1 border-t">
                        <span>设置初始充值金额(元)：</span>
                        <input type="number" class="new-bal-input w-full p-1 text-xs border rounded bg-white" placeholder="例如: 100" value="100">
                    </div>
                `;
                subActionDiv.classList.remove('hidden');
            } else if (val === 'link') {
                let opts = db.members.map(m => `<option value="${m.name}">${m.name}</option>`).join('');
                subActionDiv.innerHTML = `
                    <div class="text-xs text-blue-800 space-y-1 pt-1 border-t">
                        <span>选择要挂靠的已有会员：</span>
                        <select class="link-target-sel w-full p-1 text-xs border rounded bg-white">${opts}</select>
                    </div>
                `;
                subActionDiv.classList.remove('hidden');
            }
        }

        // 执行批量划扣
        function executeDeduction() {
            if (isSettledCurrentSession) {
                return alert('本次活动结算已经完成，请勿重复操作！如需记新账请点击“发起新接龙结算”。');
            }

            const rows = document.querySelectorAll('.participant-row');
            if (rows.length === 0) return alert('没有需要结算的人员');

            const memberPrice = parseFloat(document.getElementById('member-price').value) || 35;
            const guestPrice = parseFloat(document.getElementById('guest-price').value) || 45;
            
            let announcementLines = [];
            announcementLines.push(`【羽毛球活动结算账单】`);
            announcementLines.push(`📅 日期：${currentParsedHeader.date}`);
            if (currentParsedHeader.location) announcementLines.push(`📍 地点：${currentParsedHeader.location}`);
            if (currentParsedHeader.time) announcementLines.push(`⏰ 时间：${currentParsedHeader.time}`);
            announcementLines.push(`---------------------------`);

            let totalAmount = 0;
            let totalParticipantsCount = 0;
            let activityDetails = [];

            rows.forEach(row => {
                const rawText = row.getAttribute('data-rawtext');
                const lookupName = row.getAttribute('data-lookupname');
                const count = parseInt(row.getAttribute('data-count')) || 1;
                const typeSelect = row.querySelector('.payer-type');
                const type = typeSelect.value;
                totalParticipantsCount += count;
                
                let logText = "";
                let chargedAmount = 0;

                if (type === 'member') {
                    const member = findMemberByName(lookupName);
                    if (member) {
                        chargedAmount = memberPrice * count;
                        member.balance -= chargedAmount;
                        logText = `${rawText} (扣划归主 ${lookupName}): 扣费 ￥${chargedAmount} (卡余: ￥${member.balance})`;
                    }
                } else if (type === 'create') {
                    const balInput = row.querySelector('.new-bal-input');
                    const initialBal = balInput ? parseFloat(balInput.value) || 0 : 0;
                    chargedAmount = memberPrice * count;
                    const newBalance = initialBal - chargedAmount;
                    
                    db.members.push({
                        name: lookupName,
                        aliases: [],
                        balance: newBalance
                    });
                    logText = `${rawText} (新会员 ${lookupName}, 充值￥${initialBal}): 扣费 ￥${chargedAmount} (卡余: ￥${newBalance})`;
                } else if (type === 'link') {
                    const targetSel = row.querySelector('.link-target-sel');
                    const targetName = targetSel ? targetSel.value : '';
                    const targetMember = findMemberByName(targetName);
                    chargedAmount = memberPrice * count;
                    
                    if (targetMember) {
                        if (!targetMember.aliases.includes(lookupName)) {
                            targetMember.aliases.push(lookupName);
                        }
                        targetMember.balance -= chargedAmount;
                        logText = `${rawText} (归属 ${targetMember.name}): 扣费 ￥${chargedAmount} (卡余: ￥${targetMember.balance})`;
                    } else {
                        chargedAmount = guestPrice * count;
                        logText = `${rawText}: 现金/转账 ￥${chargedAmount}`;
                    }
                } else {
                    chargedAmount = guestPrice * count;
                    logText = `${rawText}: 现金/转账 ￥${chargedAmount}`;
                }

                totalAmount += chargedAmount;
                announcementLines.push(logText);

                activityDetails.push({
                    rawText: rawText,
                    lookupName: lookupName,
                    count: count,
                    chargedAmount: chargedAmount,
                    logText: logText
                });
            });

            announcementLines.push(`---------------------------`);
            announcementLines.push(`📊 本场总人数：${totalParticipantsCount}人，总消费：￥${totalAmount}`);

            const announcementFullText = announcementLines.join('\n');
            document.getElementById('group-announcement').value = announcementFullText;

            const historyItem = {
                id: 'act_' + Date.now(),
                createdAt: new Date().toLocaleString(),
                date: currentParsedHeader.date,
                location: currentParsedHeader.location,
                time: currentParsedHeader.time,
                totalParticipants: totalParticipantsCount,
                totalAmount: totalAmount,
                announcementText: announcementFullText,
                details: activityDetails
            };
            db.history.unshift(historyItem);

            saveDB();

            isSettledCurrentSession = true;
            document.getElementById('settlement-result').classList.add('hidden');
            document.getElementById('output-box').classList.remove('hidden');
            alert('划扣成功！活动记录已自动归档至“历史活动”中。');
        }

        function copyAnnouncement() {
            const txt = document.getElementById('group-announcement');
            txt.select();
            document.execCommand('copy');
            alert('群公告文本已复制到剪贴板！');
        }

        function resetActivityForm() {
            document.getElementById('checkin-text').value = '';
            document.getElementById('activity-info-card').classList.add('hidden');
            document.getElementById('settlement-result').classList.add('hidden');
            document.getElementById('output-box').classList.add('hidden');
            isSettledCurrentSession = false;
        }

        // 渲染历史活动列表
        function renderHistory() {
            const listEl = document.getElementById('history-list');
            const countEl = document.getElementById('history-count');
            if (!listEl) return;
            if (countEl) countEl.innerText = db.history.length;

            if (db.history.length === 0) {
                listEl.innerHTML = '<p class="text-xs text-gray-400 text-center py-6">暂无历史活动记账记录</p>';
                return;
            }

            listEl.innerHTML = db.history.map((item, idx) => `
                <div class="bg-gray-50 p-3 rounded-lg border space-y-2 text-xs">
                    <div class="flex justify-between items-start">
                        <div>
                            <div class="font-bold text-sm text-emerald-800">${item.date}</div>
                            <div class="text-gray-500 mt-0.5">${item.location} | ${item.time}</div>
                        </div>
                        <button onclick="deleteHistoryItem('${item.id}')" class="text-red-500 text-xs hover:underline">删除</button>
                    </div>
                    <div class="flex justify-between items-center bg-white p-2 rounded border text-gray-700 font-medium">
                        <span>人数: ${item.totalParticipants}人</span>
                        <span>流水: ￥${item.totalAmount}</span>
                    </div>
                    <div class="space-x-2 pt-1">
                        <button onclick="toggleHistoryDetail('${item.id}')" class="bg-blue-50 text-blue-700 px-2.5 py-1 rounded border border-blue-200">查看账单明细</button>
                        <button onclick="exportSingleHistoryExcel(${idx})" class="bg-emerald-50 text-emerald-700 px-2.5 py-1 rounded border border-emerald-200">导出此场 Excel</button>
                    </div>
                    <div id="detail-${item.id}" class="hidden pt-2 border-t mt-2">
                        <textarea readonly class="w-full p-2 bg-white border rounded text-xs font-mono h-32">${item.announcementText}</textarea>
                    </div>
                </div>
            `).join('');
        }

        function toggleHistoryDetail(id) {
            const el = document.getElementById(`detail-${id}`);
            if (el) el.classList.toggle('hidden');
        }

        function deleteHistoryItem(id) {
            if (confirm('确认删除该场历史活动记录吗？（不影响已有会员余额）')) {
                db.history = db.history.filter(h => h.id !== id);
                saveDB();
            }
        }

        function exportSingleHistoryExcel(index) {
            const item = db.history[index];
            if (!item) return;

            const excelData = item.details.map((d, i) => ({
                "序号": i + 1,
                "活动日期": item.date,
                "球馆/地点": item.location,
                "报名行": d.rawText,
                "扣划归主": d.lookupName,
                "人数": d.count,
                "扣费金额(元)": d.chargedAmount,
                "流水记录": d.logText
            }));

            const worksheet = XLSX.utils.json_to_sheet(excelData);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "打球账单");
            XLSX.writeFile(workbook, `羽毛球账单_${item.date}.xlsx`);
        }

        function exportAllHistoryExcel() {
            if (db.history.length === 0) return alert('暂无历史记录可导出');

            let allRows = [];
            db.history.forEach(item => {
                item.details.forEach(d => {
                    allRows.push({
                        "活动日期": item.date,
                        "球馆地点": item.location,
                        "时间段": item.time,
                        "报名条目": d.rawText,
                        "归属扣费人": d.lookupName,
                        "人数": d.count,
                        "实扣/现金(元)": d.chargedAmount,
                        "流水明细": d.logText
                    });
                });
            });

            const worksheet = XLSX.utils.json_to_sheet(allRows);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "全部历史打球记录");
            XLSX.writeFile(workbook, `羽毛球全部历史活动汇总_${new Date().toISOString().slice(0,10)}.xlsx`);
        }

        // Excel 导入与 JSON 恢复
        function previewExcel(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const rows = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { defval: "" });
                    if (rows.length === 0) return alert('Excel 内容为空');

                    tempExcelRows = rows;
                    const keys = Object.keys(rows[0]);

                    const nameSelect = document.getElementById('col-name');
                    const balanceSelect = document.getElementById('col-balance');
                    nameSelect.innerHTML = keys.map(k => `<option value="${k}">${k}</option>`).join('');
                    balanceSelect.innerHTML = keys.map(k => `<option value="${k}">${k}</option>`).join('');

                    keys.forEach(k => {
                        const l = k.toLowerCase();
                        if (l.includes('名') || l.includes('称') || l.includes('昵')) nameSelect.value = k;
                        if (l.includes('余') || l.includes('额') || l.includes('卡') || l.includes('费')) balanceSelect.value = k;
                    });

                    document.getElementById('excel-preview-box').classList.remove('hidden');
                    alert(`成功读取 Excel，共 ${rows.length} 行。`);
                } catch (err) {
                    alert('解析 Excel 失败');
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function confirmExcelImport() {
            const nameKey = document.getElementById('col-name').value;
            const balanceKey = document.getElementById('col-balance').value;

            let count = 0;
            tempExcelRows.forEach(row => {
                const name = String(row[nameKey] || '').trim();
                const balance = parseFloat(row[balanceKey]) || 0;
                if (name) {
                    const existing = db.members.find(m => m.name === name);
                    if (existing) {
                        existing.balance = balance;
                    } else {
                        db.members.push({ name, aliases: [], balance });
                    }
                    count++;
                }
            });

            saveDB();
            document.getElementById('excel-preview-box').classList.add('hidden');
            alert(`成功导入 ${count} 位会员！`);
            switchTab('members');
        }

/**
        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(db));
            const a = document.createElement('a');
            a.href = dataStr;
            a.download = `badminton_full_backup_${new Date().toISOString().slice(0,10)}.json`;
            document.body.appendChild(a);
            a.click();
            a.remove();
        }
*/
        function exportData() {
            const jsonStr = JSON.stringify(db, null, 2);
            
            // 1. 创建 Blob 对象，使用通用二进制流类型强制移动端触发下载
            const blob = new Blob([jsonStr], { type: 'application/octet-stream' });
            const url = URL.createObjectURL(blob);
            
            // 2. 动态创建 a 标签并触发下载
            const a = document.createElement('a');
            a.href = url;
            a.download = `badminton_full_backup_${new Date().toISOString().slice(0,10)}.json`;
            
            document.body.appendChild(a);
            a.click();
            
            // 3. 延时清理 DOM 和释放内存
            setTimeout(() => {
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }, 1000);
        }

        function importJSONData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    let imported = JSON.parse(e.target.result);
                    if (imported) {
                        db = {
                            members: (imported.members || []).map(m => ({
                                name: m.name || '',
                                aliases: m.aliases || [],
                                balance: typeof m.balance === 'number' ? m.balance : 0
                            })),
                            history: imported.history || []
                        };
                        saveDB();
                        alert('完整备份数据恢复成功！');
                        switchTab('members');
                    }
                } catch(err) {
                    alert('JSON 解析失败');
                }
            };
            reader.readAsText(file);
        }

        // 初始化渲染
        renderMembers();
        renderHistory();
    </script>
</body>
